{% extends "base.html" %}

{% load django_bootstrap5 %}
{% load i18n %}

{% block content %}
<div class="container wrapper flex-grow-1">
    <h1 class="my-4">{% trans "Edit user" %}</h1>
    <form method="post">
        {% csrf_token %}
        <div class="card form-card shadow-sm mb-4">
            <div class="card-body p-3 p-md-4">
                {% bootstrap_form form %}
            </div>
        </div>
        <button type="submit" class="btn btn-primary me-2">
            {% trans "Save" %}
        </button>
        <a href="{% url 'user:user-detail' user.username %}" class="btn btn-secondary">
            {% trans "Cancel" %}
        </a>
    </form>
</div>
{% endblock %}
